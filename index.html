<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF=8">
    <meta name="viewport" content="with904, initial-scale=1.0">
    <title>CALCULADORA</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    </head>
<body>
  <div class="calc">
    <div class="display" id="display">0</div>
    <div class="keys">
      <button class="clear">C</button>
      <button class="op">/</button>
      <button class="op">*</button>
      <button class="op">-</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="op">+</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="eq">=</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>0</button>

      <button>.</button>
  </div>
</div>

   
</body>
</html>
